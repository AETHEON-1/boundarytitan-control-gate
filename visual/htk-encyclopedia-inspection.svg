<text x="653" y="155" class="t">Sigma-2 / Raccoon</text>
<text x="653" y="182" class="s">Who approved? Who stops?</text>
<text x="653" y="207" class="s">Defeating tests and omissions</text>
<rect x="935" y="125" width="230" height="115" rx="14" class="archive"/>
<text x="953" y="155" class="t">Encyclopedia</text>
<text x="953" y="182" class="s">Frozen candidate record</text>
<text x="953" y="207" class="s">Linked corrections, no erasure</text>
