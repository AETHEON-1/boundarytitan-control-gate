<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">HTK to Encyclopedia inspectable authority transition</title>
<desc id="desc">Human utterance flows into HTK translation, Sigma-2 gap inspection and an Encyclopedia research candidate; an external independent authorization bridge is separated from these research outputs. No machine result authorizes real-world execution.</desc>
