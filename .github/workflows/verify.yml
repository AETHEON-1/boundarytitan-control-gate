name: bounded verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture npm advisory report (diagnostic only)
        shell: bash
        run: |
          status=0
          npm audit --json > npm-audit-report.json || status=$?
          echo "npm audit exit code: $status (diagnostic, not a security gate)"
          if [ ! -s npm-audit-report.json ]; then
            echo "Audit report missing or empty" >&2
            exit 1
          fi
          exit 0
      - name: Preserve npm advisory report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.sha }}
          path: npm-audit-report.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove transient audit file before tracked-tree verification
        run: rm npm-audit-report.json
      - name: Typecheck
        run: npm run typecheck
      - name: Run Jest
        run: npm test -- --coverage=false
      - name: Run Python handoff tests
        run: npm run test:python
      - name: Verify repository state
        run: npm run verify:state
