name: sigma2 synthetic comparison

on:
  push:
    paths:
      - 'tests/test_sigma2_incremental_detection.py'
      - '.github/workflows/sigma2-incremental-detection.yml'
  pull_request:
    paths:
      - 'tests/test_sigma2_incremental_detection.py'
      - '.github/workflows/sigma2-incremental-detection.yml'

permissions:
  contents: read

jobs:
  synthetic-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute isolated synthetic fixtures
        run: python3 tests/test_sigma2_incremental_detection.py -v
