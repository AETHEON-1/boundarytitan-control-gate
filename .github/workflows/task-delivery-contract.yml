name: Task delivery contract tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/task-delivery-envelope.test.js
      - run: npm run verify:state
