name: prompt-injection-gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  injection-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Run gate unit tests
        run: node --test security/prompt-gate.test.mjs
      - name: Validate gate policy and sensitive path manifest
        run: node security/prompt-gate.mjs --check
