name: HTK inspection verification
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  htk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/htk-inspector.test.js
      - run: node --test scripts/htk-to-encyclopedia.test.js
      - run: node scripts/htk-to-encyclopedia.js research/fixtures/htk-inspection-v0.1.json .research-output/htk-eoc-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: htk-encyclopedia-candidate
          path: .research-output/htk-eoc-candidate.json
          retention-days: 30
      - run: npm run verify:state
