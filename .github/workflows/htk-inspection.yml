name: HTK inspection verification
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  htk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/htk-inspector.test.js
      - run: npm run verify:state
